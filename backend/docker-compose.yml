services:
  redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    profiles:
      - local-db
    image: postgres:${POSTGRES_VERSION:-16}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-se114_db}
      POSTGRES_USER: ${POSTGRES_USER:-se114_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-se114_password}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  postgres_data:
