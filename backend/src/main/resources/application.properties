spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

spring.application.name=backend
server.port=8080

# 1. DATABASE CONNECTION
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. FLYWAY (Database Migration)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-migration-naming=true

# 3. JPA & HIBERNATE
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT CONFIGURATION
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# STRIPE CONFIGURATION
stripe.api.key=${STRIPE_SECRET_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
stripe.success.url=${STRIPE_SUCCESS_URL:http://localhost:3000/payment/success}
stripe.cancel.url=${STRIPE_CANCEL_URL:http://localhost:3000/payment/cancel}

# REDIS
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${SPRING_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=false
spring.data.redis.timeout=2s

# BOOKING REDIS LOCK
app.booking.redis-lock-enabled=true
app.booking.redis-lock-prefix=lock:booking:slot:
app.booking.redis-lock-ttl-seconds=10

# MAIL
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# AUTH OTP
app.auth.registration-otp-required=true
app.auth.otp.mail-enabled=${APP_AUTH_OTP_MAIL_ENABLED:false}
app.auth.otp.log-enabled=${APP_AUTH_OTP_LOG_ENABLED:true}
app.auth.otp.ttl-minutes=5
app.auth.otp.registration-prefix=REG_OTP_
app.auth.otp.reset-prefix=OTP_
app.auth.otp.sender-name=SE114 Football Booking

# MAINTENANCE
app.booking.cleanup-enabled=true
app.booking.pending-timeout-minutes=15
app.booking.cleanup-initial-delay-ms=30000
app.booking.cleanup-fixed-delay-ms=60000

# DEV SEEDING
app.seed.enabled=true
app.seed.admin.email=${APP_SEED_ADMIN_EMAIL:}
app.seed.admin.password=${APP_SEED_ADMIN_PASSWORD:}
app.seed.owner.email=${APP_SEED_OWNER_EMAIL:}
app.seed.owner.password=${APP_SEED_OWNER_PASSWORD:}
app.seed.player.email=${APP_SEED_PLAYER_EMAIL:}
app.seed.player.password=${APP_SEED_PLAYER_PASSWORD:}
app.seed.opponent.email=${APP_SEED_OPPONENT_EMAIL:}
app.seed.opponent.password=${APP_SEED_OPPONENT_PASSWORD:}

# SUPABASE STORAGE CONFIGURATION
supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.bucket-name=${SUPABASE_BUCKET_NAME:images}

# SPRINGDOC OPENAPI / SWAGGER
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# GROQ AI CONFIGURATION
groq.api.key=${GROQ_API_KEY:}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.api.model=${GROQ_API_MODEL:llama-3.3-70b-versatile}

# FIREBASE CONFIGURATION
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:classpath:firebase-service-account.json}
