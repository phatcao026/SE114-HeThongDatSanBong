spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

spring.application.name=${APP_NAME:backend}
server.port=${SERVER_PORT:8080}

# 1. DATABASE CONNECTION
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/se114_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:se114_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:se114_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. FLYWAY (Database Migration)
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.validate-migration-naming=${SPRING_FLYWAY_VALIDATE_MIGRATION_NAMING:true}

# 3. JPA & HIBERNATE
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:true}
spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW:false}

# JWT CONFIGURATION
jwt.secret=${JWT_SECRET:dev-only-change-this-secret-before-production-2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# STRIPE CONFIGURATION
stripe.api.key=${STRIPE_SECRET_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
stripe.success.url=${STRIPE_SUCCESS_URL:http://localhost:3000/payment/success}
stripe.cancel.url=${STRIPE_CANCEL_URL:http://localhost:3000/payment/cancel}

# REDIS
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${SPRING_REDIS_SSL_ENABLED:false}
spring.data.redis.timeout=${SPRING_REDIS_TIMEOUT:2s}

# BOOKING REDIS LOCK
app.booking.redis-lock-enabled=${BOOKING_REDIS_LOCK_ENABLED:true}
app.booking.redis-lock-prefix=${BOOKING_REDIS_LOCK_PREFIX:lock:booking:slot:}
app.booking.redis-lock-ttl-seconds=${BOOKING_REDIS_LOCK_TTL_SECONDS:10}

# MAINTENANCE
app.booking.cleanup-enabled=${BOOKING_CLEANUP_ENABLED:true}
app.booking.pending-timeout-minutes=${BOOKING_PENDING_TIMEOUT_MINUTES:15}
app.booking.cleanup-initial-delay-ms=${BOOKING_CLEANUP_INITIAL_DELAY_MS:30000}
app.booking.cleanup-fixed-delay-ms=${BOOKING_CLEANUP_FIXED_DELAY_MS:60000}

# DEV SEEDING
app.seed.enabled=${APP_SEED_ENABLED:false}
app.seed.admin.email=${APP_SEED_ADMIN_EMAIL:admin@se114.local}
app.seed.admin.password=${APP_SEED_ADMIN_PASSWORD:admin123456}
app.seed.owner.email=${APP_SEED_OWNER_EMAIL:owner@se114.local}
app.seed.owner.password=${APP_SEED_OWNER_PASSWORD:owner123456}
app.seed.player.email=${APP_SEED_PLAYER_EMAIL:player@se114.local}
app.seed.player.password=${APP_SEED_PLAYER_PASSWORD:player123456}
app.seed.opponent.email=${APP_SEED_OPPONENT_EMAIL:opponent@se114.local}
app.seed.opponent.password=${APP_SEED_OPPONENT_PASSWORD:opponent123456}
